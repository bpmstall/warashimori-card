# yaml-language-server: $schema=https://testingcf.jsdelivr.net/gh/StageDog/tavern_sync/dist/schema/settings.zh.json

# 在此填入 user 名称, 提示词中如果有这个名字则会被替换成 <user> 宏
# 注意: 本卡全文直接写 `<user>` 宏或第二人称「你」, 不使用「名字→<user>」替换机制.
# 因此这里保持一个绝不会出现在正文中的占位名字, 该功能对本卡是无操作 (no-op).
user名称: 青空黎

# 在此填入新的"角色卡"、"世界书"或"预设"配置
配置:
  # ===== 本项目: 童守岛祈愿录 (重建版) =====
  童守岛祈愿录:
    类型: 角色卡
    酒馆中的名称: 童守岛祈愿录
    本地文件路径: src/童守岛祈愿录/index
    导出文件路径: dist/童守岛祈愿录/童守岛祈愿录

  # ===== 模板自带的示例配置 (只作参考对照, 不要动) =====
  角色卡示例:
    类型: 角色卡
    酒馆中的名称: 呕吐内心的少女
    本地文件路径: 示例/角色卡示例/index
    导出文件路径: 示例/角色卡示例/角色卡示例
